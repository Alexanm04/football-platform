[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "football-platform"
version = "0.1.0"
description = "Football analytics platform"
requires-python = ">=3.12"

dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "numpy",
    "opencv-python",
    "pandas",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "pyyaml",
    "requests",
    "scikit-learn",
    "shap",
    "slowapi>=0.1.10",
    "sqlalchemy",
    "statsbombpy",
    "torch",
    "ultralytics",
    "uvicorn",
    "xgboost",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

training = [
    "huggingface-hub",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]
namespaces = true

[tool.ruff]
ignore = ["B008"]
